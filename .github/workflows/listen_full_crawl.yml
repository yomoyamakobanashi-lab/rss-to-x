name: Temporary Generate Every-Episode Funny Bank

on:
  push:
    branches:
      - feat/funny-clip-every-episode
    paths:
      - .github/workflows/listen_full_crawl.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/funny-clip-every-episode
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Crawl LISTEN transcript text
        run: |
          cat > crawl.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const headers={'user-agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36','accept-language':'ja,en-US;q=0.8,en;q=0.6'};
          async function raw(url){const r=await fetch(url,{headers,redirect:'follow'});if(!r.ok)throw new Error(`${r.status} ${url}`);return await r.text();}
          const urls=new Set(); let empty=0;
          for(let p=1;p<=20;p++){
            const listUrl=p===1?'https://listen.style/p/reelpal':`https://listen.style/p/reelpal?page=${p}`;
            const html=await raw(listUrl); const found=new Set();
            for(const re of [/href=["']\/p\/reelpal\/([A-Za-z0-9_-]+)(?:[?#][^"']*)?["']/g,/https:\/\/listen\.style\/p\/reelpal\/([A-Za-z0-9_-]+)/g,/\\u002Fp\\u002Freelpal\\u002F([A-Za-z0-9_-]+)/g]){let m;while((m=re.exec(html)))found.add(m[1]);}
            let added=0; for(const slug of found){if(['player','search'].includes(slug))continue;const u=`https://listen.style/p/reelpal/${slug}`;if(!urls.has(u)){urls.add(u);added++;}}
            console.log(`list ${p}: found=${found.size} new=${added} total=${urls.size}`); if(added===0)empty++;else empty=0; if(p>=4&&empty>=2)break;
          }
          if(urls.size<120)throw new Error(`discovery too low: ${urls.size}`);
          const browser=await chromium.launch({headless:true}); const context=await browser.newContext({viewport:{width:1280,height:900},extraHTTPHeaders:headers});
          const entries=[...urls]; const results=new Array(entries.length); let cursor=0;
          async function worker(id){const page=await context.newPage();while(true){const i=cursor++;if(i>=entries.length)break;const url=entries[i];try{const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});await page.waitForTimeout(250);const title=await page.locator('h1').first().innerText().catch(()=> '');const bodyText=await page.locator('body').innerText();results[i]={url,slug:url.split('/').pop(),title:(title||'').trim(),status:resp?.status()||null,bodyText};console.log(`[${i+1}/${entries.length}] ${bodyText.length} ${url}`);}catch(e){results[i]={url,error:String(e)};}}await page.close();}
          await Promise.all(Array.from({length:8},(_,i)=>worker(i+1))); await browser.close();
          const ok=results.filter(x=>x&&!x.error); if(ok.length<120)throw new Error(`crawl too low: ${ok.length}`);
          fs.writeFileSync('/tmp/listen.json',JSON.stringify(ok));
          EOF
          node crawl.mjs
      - name: Generate missing-episode bank and verify 127/127 coverage
        run: |
          cat > /tmp/generate.py <<'PY'
          import json,re,unicodedata,difflib
          from pathlib import Path

          ROOT=Path('.')
          spotify=json.loads((ROOT/'data/spotify_episodes.json').read_text(encoding='utf-8'))
          listen=json.loads(Path('/tmp/listen.json').read_text(encoding='utf-8'))
          existing=[]
          for p in ['funny_clip_posts.json','funny_clip_posts_archive.json','funny_clip_posts_archive_2.json','funny_clip_posts_archive_3.json']:
              existing += json.loads((ROOT/'data'/p).read_text(encoding='utf-8'))

          def norm(s):
              s=unicodedata.normalize('NFKC',str(s or '')).lower()
              s=re.sub(r'replay','',s,flags=re.I)
              return re.sub(r'[\s　#『』「」〖〗【】()（）\[\]<>〈〉《》・,:：;；.!！?？…〜~—–―ー_\-"\'“”‘’\\/*]+','',s)

          pairs=[]
          unused=set(range(len(listen)))
          for sp in spotify:
              ns=norm(sp.get('title','')); scored=[]
              for i,e in enumerate(listen):
                  ne=norm(e.get('title','')); score=difflib.SequenceMatcher(None,ns,ne).ratio()
                  if ns and (ns in ne or ne in ns): score+=.25
                  scored.append((score,i,e))
              scored.sort(reverse=True,key=lambda x:x[0]); score,i,e=scored[0]
              if score<.95: raise RuntimeError(f"low title match {sp['index']} score={score}: {sp['title']} <> {e.get('title')}")
              pairs.append((sp,e)); unused.discard(i)
          if len(pairs)!=127: raise RuntimeError(f"Spotify pairing failed: {len(pairs)}")

          sp_by_listen={e['url']:sp for sp,e in pairs}
          covered={sp_by_listen[x['source_url']]['index'] for x in existing if x.get('source_url') in sp_by_listen}
          missing=[sp for sp in spotify if sp['index'] not in covered]
          if len(covered)!=22 or len(missing)!=105: raise RuntimeError(f"unexpected baseline coverage covered={len(covered)} missing={len(missing)}")

          def transcript_lines(e):
              b=e.get('bodyText',''); p=b.find('感想を書く')
              if p>=0:b=b[p+len('感想を書く'):]
              m=re.search(r'\n0:00\n0\.5x\n0\.6x',b)
              if m:b=b[:m.start()]
              out=[];prev=None
              skip={'サマリー','目次','感想','まだ感想はありません。最初の1件を書きましょう！','感想を書く','インターミッション','オープニング','エンディング'}
              for raw in b.splitlines():
                  x=re.sub(r'\s+',' ',raw).strip()
                  if not x or x in skip:continue
                  if re.fullmatch(r'\d{1,2}:\d{2}(?::\d{2})?',x) or re.fullmatch(r'\d+(?:\.\d+)?x',x):continue
                  if x.startswith('http') or len(x)>180 or x in ('スターをつける','コメント','Your comment'):continue
                  if x.startswith('« ') or x.startswith('こちらもおすすめ'):break
                  if x==prev:continue
                  out.append(x);prev=x
              return out

          pos=['なんで','何で','なに','何','いや','めっちゃ','すげ','すご','やば','どうでも','知ら','わから','分から','無理','マジ','まじ','クソ','バカ','アホ','おかし','笑','怖','こわ','キモ','きも','でか','ちっちゃ','ほんと','だろ','じゃん','じゃね','ないの','あるの','でしょ','嘘','うそ','ちょっと待','どういう','意味わか','何の話','違う','そうそう','たぶん','多分','どうして','しかも','むしろ','絶対','急に','謎','変','妙','お前','俺','僕','それは']
          neg=['作品では','この作品','監督','主人公','テーマ','社会','歴史','構造','考察','表現','物語','映画では','本作','結論','重要','意味する','象徴','描写','キャラクター','シーン','脚本']
          def line_score(x):
              s=sum(1.2 for w in pos if w in x)-sum(.8 for w in neg if w in x)
              if '?' in x or '？' in x:s+=1.2
              if '!' in x or '！' in x:s+=.5
              if 3<=len(x)<=25:s+=.8
              elif len(x)>70:s-=1
              return s
          def top_windows(lines,nout=5):
              vals=[];n=len(lines)
              for i in range(max(0,int(n*.82))):
                  for k in range(3,7):
                      win=lines[i:i+k]
                      if len(win)<k:continue
                      total=sum(map(len,win))
                      if total<55 or total>205:continue
                      sc=sum(line_score(x) for x in win)+sum(.4 for x in win if len(x)<=12)+.4*sum(('?' in x or '？' in x) for x in win)+max(0,1.5-i/max(1,n)*3)
                      joined=''.join(win)
                      if 'よろしくお願いします' in joined:sc-=1.5
                      if 'お聞きいただきました' in joined or '番組では投稿フォーム' in joined:sc-=5
                      vals.append((sc,i,win))
              vals.sort(reverse=True,key=lambda x:x[0]);out=[]
              for v in vals:
                  if all(abs(v[1]-o[1])>4 for o in out):out.append(v)
                  if len(out)>=nout:break
              return out

          rank_override={2:2,13:3,21:2,22:2,31:2,37:3,46:2,50:3,69:2,72:2,76:3,90:3,112:4}
          recovered={
            9:['ピンさん、何か気になってる映画とかあります？ 最近の映画で','映画でしょ？','全然今、映画を……','「みんな、おしゃべり」っていうのが最近じゃないか','去年の映画なんですけど'],
            33:['ハムナプトラ見ちゃった','見たくなって見ちゃった、ハムナプトラ','やっぱりいいわ','なんなんだろうね','本当にいいわ'],
            114:['今、完全に通信が飛んでましたね','マコちゃんが止まっていた','本当？','僕はずーっとしゃべり続けていたんで','よかったよかったよかった'],
            117:['今日なんか普通だね','多分1回じゃ済まないってことがわかってるから、もうあらかじめ「その1」って打っちゃう','すげえ気になってたんだけど、今日なんか割と普通でちょっと安心したわ'],
          }
          speaker=re.compile(r'^(?:マコ|オーマ|おだしょー|タカトリヤ|楊)\s*')
          def clean(x):
              x=re.sub(r'\s+',' ',x).strip();x=speaker.sub('',x);x=re.sub(r'^[―—]{1,2}\s*','',x);return x.strip()

          pair_by_index={sp['index']:(sp,e) for sp,e in pairs}
          bank=[]
          for sp in missing:
              idx=sp['index'];_,e=pair_by_index[idx]
              if idx in recovered: dialogue=[clean(x) for x in recovered[idx]]
              else:
                  tops=top_windows(transcript_lines(e),max(5,rank_override.get(idx,1)))
                  rank=rank_override.get(idx,1)
                  if len(tops)<rank:raise RuntimeError(f"no usable dialogue window for {idx}")
                  dialogue=[clean(x) for x in tops[rank-1][2]]
              dialogue=[x for i,x in enumerate(dialogue) if x and (i==0 or x!=dialogue[i-1])]
              while len(' / '.join(dialogue))>245 and len(dialogue)>3:dialogue.pop()
              if len(dialogue)<3:raise RuntimeError(f"dialogue too short {idx}")
              url=str(sp.get('spotifyUrl') or '')
              if not url.startswith('https://open.spotify.com/episode/'):raise RuntimeError(f"bad Spotify URL {idx}: {url}")
              title=str(sp['title']).strip()
              bank.append({'id':f'all-episode-{idx:03d}','source':title,'episode_title':title,'topic':f"ep{idx}:{re.sub(r'\s+',' ',title)[:36]}",'text':' / '.join(dialogue),'dialogue':dialogue,'source_url':e['url'],'spotify_url':url})

          if len(bank)!=105:raise RuntimeError(f"generated {len(bank)} expected 105")
          all_items=existing+bank
          all_covered={sp_by_listen[x['source_url']]['index'] for x in all_items if x.get('source_url') in sp_by_listen}
          if len(all_covered)!=127:raise RuntimeError(f"coverage incomplete {len(all_covered)}/127 missing={sorted(set(range(127))-all_covered)}")
          if any(not x['spotify_url'].startswith('https://open.spotify.com/episode/') for x in bank):raise RuntimeError('non-direct Spotify link')
          (ROOT/'data/funny_clip_posts_all_episodes.json').write_text(json.dumps(bank,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f"[OK] generated={len(bank)} existing={len(existing)} episode_coverage={len(all_covered)}/127 direct_spotify={len(bank)}/105")
          PY
          python /tmp/generate.py
      - name: Validate full bank through production renderer
        env:
          FUNNY_CLIP_DRY_RUN: '1'
        run: |
          python scripts/funny_clip_spotify.py
          python - <<'PY'
          import json
          from pathlib import Path
          bank=json.loads(Path('data/funny_clip_posts_all_episodes.json').read_text())
          assert len(bank)==105
          assert all(len(x['dialogue'])>=3 for x in bank)
          assert all(x['spotify_url'].startswith('https://open.spotify.com/episode/') for x in bank)
          print('[OK] every-episode bank QA passed')
          PY
      - name: Commit generated bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/funny_clip_posts_all_episodes.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add funny dialogue clips for every remaining episode'
          git push origin HEAD:feat/funny-clip-every-episode
