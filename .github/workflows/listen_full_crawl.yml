name: Temporary Transcript Recovery

on:
  push:
    branches:
      - feat/funny-clip-every-episode
    paths:
      - .github/workflows/listen_full_crawl.yml

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install transcription tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install requests feedparser faster-whisper
      - name: Recover three broken transcripts from podcast audio
        run: |
          cat > recover.py <<'PY'
          import json, re, unicodedata, subprocess
          from pathlib import Path
          import requests, feedparser
          from faster_whisper import WhisperModel

          targets = json.loads(Path('data/spotify_episodes.json').read_text(encoding='utf-8'))
          targets = [x for x in targets if x['index'] in (9,33,117)]

          def norm(s):
              s=unicodedata.normalize('NFKC', str(s or '')).lower()
              s=re.sub(r'replay','',s,flags=re.I)
              return re.sub(r'[\s　#『』「」〖〗【】()（）\[\]<>〈〉《》・,:：;；.!！?？…〜~—–―ー_\-"\'“”‘’\\/*]+','',s)

          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0'})
          show=sess.get('https://listen.style/p/reelpal',timeout=30).text
          feed_urls=[]
          for pat in [r'<link[^>]+type=["\']application/rss\+xml["\'][^>]+href=["\']([^"\']+)', r'href=["\']([^"\']*(?:rss|feed)[^"\']*)']:
              feed_urls += re.findall(pat, show, flags=re.I)
          feed_urls += ['https://listen.style/p/reelpal/rss','https://listen.style/p/reelpal/rss.xml']
          feed=None; feed_url=None
          for u in dict.fromkeys(feed_urls):
              if u.startswith('/'): u='https://listen.style'+u
              try:
                  r=sess.get(u,timeout=30)
                  p=feedparser.parse(r.content)
                  if len(p.entries)>=80:
                      feed=p; feed_url=u; break
              except Exception as e: print('feed try failed',u,e)
          if feed is None: raise RuntimeError('Could not locate podcast RSS feed')
          print('RSS',feed_url,'entries',len(feed.entries))

          outdir=Path('recovered'); outdir.mkdir(exist_ok=True)
          model=WhisperModel('small', device='cpu', compute_type='int8')
          recovered=[]
          for target in targets:
              wanted=norm(target['title'])
              cand=[]
              for entry in feed.entries:
                  nt=norm(entry.get('title',''))
                  if nt==wanted: cand=[entry]; break
                  if wanted in nt or nt in wanted: cand.append(entry)
              if len(cand)!=1:
                  raise RuntimeError(f"RSS title match ambiguous for {target['index']}: {len(cand)}")
              entry=cand[0]
              enclosures=entry.get('enclosures',[])
              audio=None
              for enc in enclosures:
                  href=enc.get('href') or enc.get('url')
                  typ=enc.get('type','')
                  if href and ('audio' in typ or re.search(r'\.(mp3|m4a|aac)(\?|$)',href,re.I)):
                      audio=href; break
              if not audio and enclosures: audio=enclosures[0].get('href') or enclosures[0].get('url')
              if not audio: raise RuntimeError(f"No enclosure for {target['index']}")
              print('AUDIO',target['index'],audio)
              src=outdir/f"{target['index']}.audio"
              with sess.get(audio,stream=True,timeout=60) as r:
                  r.raise_for_status()
                  with src.open('wb') as f:
                      for ch in r.iter_content(1024*1024): f.write(ch)
              wav=outdir/f"{target['index']}.wav"
              subprocess.run(['ffmpeg','-y','-i',str(src),'-t','900','-ac','1','-ar','16000',str(wav)],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              segments,info=model.transcribe(str(wav),language='ja',beam_size=5,vad_filter=True,condition_on_previous_text=True)
              rows=[]
              for seg in segments:
                  text=re.sub(r'\s+',' ',seg.text).strip()
                  if text: rows.append({'start':round(seg.start,2),'end':round(seg.end,2),'text':text})
              recovered.append({'index':target['index'],'title':target['title'],'spotifyUrl':target['spotifyUrl'],'audio':audio,'segments':rows})
              print('TRANSCRIBED',target['index'],len(rows))
              src.unlink(missing_ok=True); wav.unlink(missing_ok=True)
          (outdir/'transcripts.json').write_text(json.dumps(recovered,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python recover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovered-transcripts
          path: recovered/
          retention-days: 1
