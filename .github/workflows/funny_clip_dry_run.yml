name: Funny Clip Dry Run

on:
  push:
    branches: [daily-funny-clips]
    paths:
      - '.funny-clip-test-trigger'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Validate bank without posting
        env:
          FUNNY_CLIP_DRY_RUN: '1'
        run: python -m scripts.funny_clip_buffer
