name: Validate Trend Tie-in

on:
  push:
    branches: [auto-trend-episode-tieins]
    paths: ['.github/workflows/trend-tiein-validate.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Compile scripts
        run: python -m py_compile scripts/trend_episode_tiein_buffer.py scripts/x_metrics_report.py
      - name: Dry-run live trend matching
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          TREND_TIEIN_DRY_RUN: '1'
        run: python -m scripts.trend_episode_tiein_buffer
