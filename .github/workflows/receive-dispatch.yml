name: receive-dispatch

on:
  repository_dispatch:
    types: [post-podcast, post-note]
  workflow_dispatch:

jobs:
  post-podcast:
    if: github.event.action == 'post-podcast'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python podcast_poster_buffer.py
      - name: Save podcast state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_podcast.json
          if git diff --cached --quiet; then
            echo "No podcast state change"
            exit 0
          fi
          git commit -m "update podcast state [skip ci]"
          git pull --rebase
          git push

  post-note:
    if: github.event.action == 'post-note'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python note_poster_buffer.py
      - name: Save note state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_note.json
          if git diff --cached --quiet; then
            echo "No note state change"
            exit 0
          fi
          git commit -m "update note state [skip ci]"
          git pull --rebase
          git push
