name: Temporary SNS Pack 0pzhzwyt

on:
  push:
    branches:
      - social-pack/0pzhzwyt
    paths:
      - .github/workflows/temp_social_pack_0pzhzwyt.yml

permissions:
  contents: write

jobs:
  build-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: social-pack/0pzhzwyt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Append verified latest-episode SNS pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          listen_url = 'https://listen.style/p/reelpal/0pzhzwyt'
          episode_title = '〖インターミッション〗　 #ズートピア３ とか#アナと雪の女王3 とか#牧場物語 とか'
          created_at = '2026-09-04T11:40:05+09:00'

          def load(path):
              return json.loads(Path(path).read_text(encoding='utf-8'))
          def save(path, obj):
              Path(path).write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          manifest = load('data/social_pack_manifest.json')
          if listen_url in manifest.get('processed_listen_urls', []):
              raise RuntimeError('latest episode already processed')

          social = load('data/social_pack_queue.json')
          funny = load('data/funny_clip_posts.json')
          audio = load('data/audio_clip_queue.json')

          for collection, key in [(social, 'source_url'), (funny, 'source_url')]:
              if any(x.get(key) == listen_url for x in collection):
                  raise RuntimeError(f'duplicate latest episode in {key} queue')
          if any(x.get('listen_url') == listen_url for x in audio):
              raise RuntimeError('duplicate latest episode in audio queue')

          social.extend([
            {
              'id': '0pzhzwyt-three-hooks',
              'kind': 'three_hooks',
              'text': '今回のインターミッション。①『ズートピア2』から続編頼みのディズニーに「新しいものを作れ」 ②『牧場物語』新作が“ガチ農業”化してつらい ③無双・BASARAから、歴史上の人物はどこまで超解釈していいのか。映画→ゲーム→織田信長703人まで行きました。',
              'source_url': listen_url,
              'not_before': '2026-09-05T12:10:00+09:00',
              'created_at': created_at,
            },
            {
              'id': '0pzhzwyt-episode-hook',
              'kind': 'episode_hook',
              'text': '巨大IPは、失敗を恐れるほど「新しい世界」を作れなくなるのか。ディズニーの続編戦略から『牧場物語』、無双シリーズまで、映画とゲームに共通する“安全策が創造性を削る問題”を延々しゃべっています。',
              'source_url': listen_url,
              'not_before': '2026-09-08T12:10:00+09:00',
              'created_at': created_at,
            },
          ])

          funny.extend([
            {
              'id': '0pzhzwyt-oomagatoki',
              'source': 'intermission-0pzhzwyt',
              'episode_title': episode_title,
              'source_url': listen_url,
              'timestamp': '15:13',
              'topic': 'オオマガトキ',
              'text': 'ゲーム会社の過去作を眺めていて「オオマガトキっていうのがありますね」「俺？」。名前が一瞬オーマ本人に聞こえて、ホラーノベルの説明へ進む前に引っかかっています。'
            },
            {
              'id': '0pzhzwyt-nobunaga-703',
              'source': 'intermission-0pzhzwyt',
              'episode_title': episode_title,
              'source_url': listen_url,
              'timestamp': '30:03',
              'topic': '703人の織田信長',
              'text': '「なぜ女体化？」の記事を見つけたのに、その前に“585作品703人の織田信長”という数字で思考停止。「703名の信長って何よ」。最後は信長だけを集めた図鑑が欲しくなっています。'
            },
          ])

          audio.append({
            'id': 'audio-0pzhzwyt-oomagatoki',
            'episode_title': episode_title,
            'listen_url': listen_url,
            'start_seconds': 913,
            'duration_seconds': 25,
            'topic': 'オオマガトキ',
            'caption': '「オオマガトキっていうのがありますね」「俺？」。ゲーム名が一瞬オーマ本人に聞こえる、15分台の短い脱線。'
          })

          # Validate generated roots before marking the episode processed.
          new_social = [x for x in social if x.get('source_url') == listen_url]
          if {x.get('kind') for x in new_social} != {'three_hooks', 'episode_hook'}:
              raise RuntimeError('unexpected social pack kinds')
          if any(len(x['text']) > 280 for x in new_social):
              raise RuntimeError('social root exceeds 280 chars')
          if any('http://' in x['text'] or 'https://' in x['text'] for x in new_social):
              raise RuntimeError('external link found in social root')
          if len([x for x in funny if x.get('source_url') == listen_url]) != 2:
              raise RuntimeError('funny clip count mismatch')
          if len([x for x in audio if x.get('listen_url') == listen_url]) != 1:
              raise RuntimeError('audio clip count mismatch')

          save('data/social_pack_queue.json', social)
          save('data/funny_clip_posts.json', funny)
          save('data/audio_clip_queue.json', audio)

          # Mark processed only after all generation and validation succeeds.
          manifest.setdefault('processed_listen_urls', []).append(listen_url)
          save('data/social_pack_manifest.json', manifest)
          print('[OK] three_hooks=1 host_split=0 episode_hook=1 funny=2 audio=1')
          PY
      - name: Commit generated pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/social_pack_queue.json data/funny_clip_posts.json data/audio_clip_queue.json data/social_pack_manifest.json
          git diff --cached --quiet && exit 0
          git commit -m 'Add SNS pack for LISTEN 0pzhzwyt'
          git push origin HEAD:social-pack/0pzhzwyt
