name: Daily Funny Clips via Buffer

on:
  schedule:
    # 毎日 21:20 JST (= 12:20 UTC)。夜の高反応帯に脱線会話を固定投入。
    - cron: '20 12 * * *'
  workflow_dispatch:
  push:
    branches:
      - fix/funny-clip-quality-qa
    paths:
      - '.github/FUNNY_CLIP_POST_ONCE'
      - '.github/workflows/funny_clip_posts.yml'

concurrency:
  group: funny-clip-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh Spotify episode metadata from RSS and official catalog
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/buildSpotifyEpisodesFromRSS.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post LISTEN-grounded funny clip with exact Spotify reply through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.funny_clip_spotify

      - name: Save funny clip rotation state and refreshed Spotify metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_funny_clip.json data/spotify_episodes.json
          if git diff --cached --quiet; then
            echo "No funny clip state or Spotify metadata change"
            exit 0
          fi
          git commit -m "refresh Spotify episode map and rotate funny clip [skip ci]"
          git pull --rebase
          git push
