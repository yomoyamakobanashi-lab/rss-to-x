name: Funny Clip Audio Verify

on:
  workflow_dispatch:
  push:
    branches:
      - fix/funny-clip-quality-qa
    paths:
      - '.github/workflows/funny_clip_audio_verify.yml'

permissions:
  contents: read

jobs:
  transcribe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - clip_id: all-episode-009
            audio_url: 'https://anchor.fm/s/10422ca68/podcast/play/123013829/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2026-6-18%2F428201039-44100-2-5ef8ee6a11e43.m4a'
          - clip_id: all-episode-033
            audio_url: 'https://anchor.fm/s/10422ca68/podcast/play/117970752/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2026-3-4%2F421425782-44100-2-7a33dddc0f121.m4a'
          - clip_id: all-episode-114
            audio_url: 'https://anchor.fm/s/10422ca68/podcast/play/103956165/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2025-5-11%2F401945779-44100-2-21237a91a6655.m4a'
          - clip_id: all-episode-117
            audio_url: 'https://anchor.fm/s/10422ca68/podcast/play/103947600/https%3A%2F%2Fd3ctxlq1ktw2nl.cloudfront.net%2Fstaging%2F2025-5-10%2F401934579-44100-2-58e64b17ffb93.m4a'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fast ASR runtime
        run: |
          python -m pip install --quiet faster-whisper requests
      - name: Download source audio
        env:
          AUDIO_URL: ${{ matrix.audio_url }}
          CLIP_ID: ${{ matrix.clip_id }}
        run: |
          mkdir -p /tmp/funny-audio /tmp/funny-asr
          python - <<'PY'
          import os, requests
          url = os.environ['AUDIO_URL']
          out = f"/tmp/funny-audio/{os.environ['CLIP_ID']}.m4a"
          with requests.get(url, stream=True, timeout=60) as response:
              response.raise_for_status()
              with open(out, 'wb') as fh:
                  for chunk in response.iter_content(1024 * 1024):
                      if chunk:
                          fh.write(chunk)
          print(out)
          PY
      - name: Transcribe source audio
        env:
          CLIP_ID: ${{ matrix.clip_id }}
        run: |
          python - <<'PY'
          import json, os
          from faster_whisper import WhisperModel

          clip_id = os.environ['CLIP_ID']
          audio = f"/tmp/funny-audio/{clip_id}.m4a"
          out = f"/tmp/funny-asr/{clip_id}-whisper.json"
          model = WhisperModel("tiny", device="cpu", compute_type="int8", cpu_threads=4, num_workers=1)
          segments, info = model.transcribe(
              audio,
              language="ja",
              beam_size=1,
              best_of=1,
              condition_on_previous_text=False,
              vad_filter=True,
          )
          rows = []
          for seg in segments:
              rows.append({"start": round(seg.start, 3), "end": round(seg.end, 3), "text": seg.text.strip()})
          payload = {
              "clip_id": clip_id,
              "language": info.language,
              "language_probability": info.language_probability,
              "duration": info.duration,
              "segments": rows,
              "text": " ".join(x["text"] for x in rows),
          }
          with open(out, "w", encoding="utf-8") as fh:
              json.dump(payload, fh, ensure_ascii=False, indent=2)
          print(f"segments={len(rows)} duration={info.duration:.1f}s")
          PY
      - name: Upload temporary QA transcript
        uses: actions/upload-artifact@v4
        with:
          name: funny-audio-${{ matrix.clip_id }}
          path: /tmp/funny-asr/${{ matrix.clip_id }}-whisper.json
          if-no-files-found: error
          retention-days: 7
