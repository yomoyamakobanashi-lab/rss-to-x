name: Weekly Digest via Buffer

on:
  schedule:
    - cron: '0 12 * * 6' # 土曜 21:00 JST
  workflow_dispatch:

concurrency:
  group: promo-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Post weekly digest through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.weekly_digest_buffer
      - name: Save promotion dedupe state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_promo.json
          if git diff --cached --quiet; then
            echo "No promotion state change"
            exit 0
          fi
          git commit -m "update promotion state [skip ci]"
          git pull --rebase
          git push
