name: Social Pack Posts via Buffer

on:
  schedule:
    # JST 08:10 / 12:10 / 17:10。due itemだけを高反応帯に投入する。
    - cron: '10 23 * * *'
    - cron: '10 3 * * *'
    - cron: '10 8 * * *'
  workflow_dispatch:

concurrency:
  group: social-pack-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post one due social pack item
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.social_pack_buffer

      - name: Save social pack state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state_social_pack.json
          if git diff --cached --quiet; then
            echo "No social pack state change"
            exit 0
          fi
          git commit -m "rotate social pack post [skip ci]"
          git pull --rebase
          git push
