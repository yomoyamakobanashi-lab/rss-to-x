name: Buffer connection test

on:
  push:
    branches: [buffer-migration]
    paths:
      - '.github/workflows/buffer-connection-test.yml'
      - 'buffer_client.py'
      - 'scripts/buffer_connection_test.py'
  workflow_dispatch:

jobs:
  test-buffer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Validate Buffer API and X channel
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python scripts/buffer_connection_test.py
