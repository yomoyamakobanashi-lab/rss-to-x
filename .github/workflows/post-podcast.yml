name: Post Podcast via Buffer

on:
  schedule:
    # 6時間ごとにRSSを確認。未投稿の新着がある時だけBufferへ送る。
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: podcast-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check Buffer secret
        run: |
          test -n "${{ secrets.BUFFER_API_KEY }}" || (echo "BUFFER_API_KEY is empty" && exit 1)

      - name: Run podcast poster
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python podcast_poster_buffer.py

      - name: Save podcast state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f state_podcast.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git pull --rebase
            git add state_podcast.json
            git commit -m "update podcast state [skip ci]" || exit 0
            git push
          fi
