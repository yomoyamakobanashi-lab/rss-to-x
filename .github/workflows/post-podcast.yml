name: Post Podcast via Buffer

on:
  schedule:
    # 毎時17分にRSSを確認。最新回が未告知かつ公開48時間以内の時だけBufferへ送る。
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: podcast-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sanity check Buffer secret
        run: |
          test -n "${{ secrets.BUFFER_API_KEY }}" || (echo "BUFFER_API_KEY is empty" && exit 1)

      - name: Refresh exact Spotify episode index
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: node scripts/buildSpotifyEpisodesFromRSS.js

      - name: Run podcast poster
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          PODCAST_MIN_AGE_MINUTES: '15'
          PODCAST_MAX_CONTENT_AGE_HOURS: '48'
        run: |
          set -euo pipefail
          python podcast_poster_buffer.py

      - name: Save podcast state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f state_podcast.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state_podcast.json data/spotify_episodes.json data/episode_platform_links.json
            if git diff --cached --quiet; then
              echo "No podcast state change"
              exit 0
            fi
            git commit -m "update podcast state [skip ci]"
            git pull --rebase
            git push
          fi
