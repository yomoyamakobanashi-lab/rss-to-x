name: Temporary Funny Transcript Cleanup

on:
  push:
    branches:
      - fix/funny-clip-transcript-cleanup
    paths:
      - .github/workflows/funny_transcript_cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/funny-clip-transcript-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependency
        run: python -m pip install requests
      - name: Correct transcript text and renderer quoting
        run: |
          cat > /tmp/fix.py <<'PY'
          import json
          from pathlib import Path

          bank_path = Path('data/funny_clip_posts_all_episodes.json')
          bank = json.loads(bank_path.read_text(encoding='utf-8'))
          by_id = {x['id']: x for x in bank}

          fixes = {
            'all-episode-000': [
              ('鴨川ホルモン', '鴨川ホルモー'),
            ],
            'all-episode-005': [
              ('大棟', '黄桃'),
            ],
            'all-episode-006': [
              ('もう虎は家族', 'もう寅は家族'),
            ],
            'all-episode-009': [
              ('ピンさん', 'ピーノさん'),
            ],
            'all-episode-013': [
              ('方針縁起', '封神演義'),
              ('先頭って応答', '仙桃って黄桃'),
              ('人数力', '人智を超えた力'),
              ('応答だったら', '黄桃だったら'),
            ],
            'all-episode-015': [
              ('お娘さん', 'お嬢さん'),
              ('藤いかぜ', '藤井風'),
            ],
            'all-episode-017': [
              ('道場破りみたいなの撮ったの?', '道場破りみたいなのと思ったの?'),
              ('そんな狂気', 'そんな競技'),
            ],
            'all-episode-021': [
              ('切り散らかすときに', 'キレ散らかすときに'),
            ],
            'all-episode-025': [
              ('クダギツネ', '管狐'),
            ],
            'all-episode-026': [
              ('何で常に常なんでしょうね', '何で常套なんでしょうね'),
            ],
            'all-episode-027': [
              ('これ何使うの?', 'これ何に使うの?'),
              ('おじさんが今では人形遊び', 'おじさんが今でも人形遊び'),
            ],
            'all-episode-030': [
              ('ハルマン', 'ハヌマン'),
            ],
            'all-episode-031': [
              ('昨今のナロウ', '昨今のなろう'),
            ],
            'all-episode-034': [
              ('何それ? 楊 フカキョン', '何それ? フカキョン'),
              ('知らない 楊 あの', '知らない あの'),
            ],
            'all-episode-036': [
              ('土三日時計', '土御門家'),
            ],
            'all-episode-040': [
              ('三つ玉絵', '三つ巴'),
            ],
            'all-episode-046': [
              ('ハグリット', 'ハグリッド'),
            ],
            'all-episode-050': [
              ('オオマ', 'オーマ'),
              ('余物併食い', 'ヨモツヘグイ'),
            ],
            'all-episode-052': [
              ('現場式', '現場指揮'),
            ],
            'all-episode-057': [
              ('ガイム', '鎧武'),
            ],
            'all-episode-071': [
              ('フェスタ', 'フェスター'),
            ],
            'all-episode-072': [
              ('イボンヌ', 'ビルボ'),
            ],
            'all-episode-073': [
              ('ボルペン', 'ボールペン'),
              ('大間知らないと思うけど', 'オーマ知らないと思うけど'),
            ],
            'all-episode-075': [
              ('百人一緒の漫画', '百人一首の漫画'),
              ('チハヤブル', 'ちはやふる'),
            ],
            'all-episode-077': [
              ('レプリティアン', 'レプティリアン'),
            ],
            'all-episode-081': [
              ('計1万点を取り合う', '計10万点を取り合う'),
            ],
            'all-episode-083': [
              ('僕はおはまりして', '僕はドハマりして'),
            ],
            'all-episode-087': [
              ('完成も上がったところで', '歓声も上がったところで'),
              ('俺今回こうこうでいいよ', '俺今回後攻でいいよ'),
            ],
            'all-episode-088': [
              ('オウマって', 'オーマって'),
              ('オウマ 僕', 'オーマ 僕'),
            ],
            'all-episode-090': [
              ('湿菌', '失禁'),
            ],
            'all-episode-092': [
              ('三角部', '山岳部'),
            ],
            'all-episode-098': [
              ('ブラックウィード', 'ブラック・ウィドウ'),
            ],
            'all-episode-099': [
              ('X面ゼロ', 'X-MEN ZERO'),
            ],
            'all-episode-102': [
              ('ちょっと手術かわいそうだよそれは', 'ちょっとシュルツかわいそうだよそれは'),
            ],
            'all-episode-108': [
              ('そんな頃に合図見てたの?', 'そんな頃に『I\"s（アイズ）』見てたの?'),
              ('合図についてはまた今度語りましょうかね', '『I\"s（アイズ）』についてはまた今度語りましょうかね'),
            ],
            'all-episode-111': [
              ('真珠もの', '心中もの'),
            ],
            'all-episode-113': [
              ('武之内豊か', '竹野内豊'),
              ('アンゴジの中で', 'アメゴジの中で'),
            ],
            'all-episode-114': [
              ('ちゃんが止まっていた', 'マコちゃんが止まっていた'),
            ],
          }

          def replace_entry(item, old, new):
              hits = 0
              if old in item.get('text', ''):
                  item['text'] = item['text'].replace(old, new)
                  hits += 1
              dialogue = item.get('dialogue') or []
              new_dialogue = []
              for line in dialogue:
                  if old in line:
                      line = line.replace(old, new)
                      hits += 1
                  new_dialogue.append(line)
              if dialogue:
                  item['dialogue'] = new_dialogue
              return hits

          applied = []
          for clip_id, replacements in fixes.items():
              if clip_id not in by_id:
                  raise RuntimeError(f'missing clip id: {clip_id}')
              for old, new in replacements:
                  n = replace_entry(by_id[clip_id], old, new)
                  if n == 0:
                      raise RuntimeError(f'expected phrase not found in {clip_id}: {old}')
                  applied.append((clip_id, old, new, n))

          # The Hangover line was too corrupted to reconstruct safely. Replace the
          # whole selected beat with a clear exchange present in the episode transcript.
          h = by_id['all-episode-070']
          h['dialogue'] = [
              'ちなみに私は7足す8は15で気持ちよくなるタイプで',
              'ブラッドリー・クーパーとマツダ選手は似ていると思っています',
              '不毛な戦いに結論が出ましたね',
              'どっちも合ってるってことでした',
              'どっちも合ってる。ほら、7足す8は15は気持ちいいんで',
              'ブラッドリー・クーパーとマツダ選手、似てるから',
          ]
          h['text'] = ' / '.join(h['dialogue'])

          bank_path.write_text(json.dumps(bank, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Avoid ugly nested 「「title」...」 when an explicit transcript line itself
          # contains Japanese quote marks; use 『』 for the embedded title/quotation.
          renderer = Path('scripts/funny_clip_buffer.py')
          code = renderer.read_text(encoding='utf-8')
          old = '''    clean = re.sub(r"^(?:マコ|オーマ|おだしょー|おだしょー)\\s+", "", clean)\n    return f"「{clean}」"'''
          new = '''    clean = re.sub(r"^(?:マコ|オーマ|おだしょー|おだしょー)\\s+", "", clean)\n    clean = re.sub(r"「([^」]+)」", r"『\\1』", clean)\n    return f"「{clean}」"'''
          if old not in code:
              raise RuntimeError('renderer target snippet not found')
          renderer.write_text(code.replace(old, new), encoding='utf-8')

          print(f'[OK] phrase fixes applied={len(applied)}; hangover dialogue replaced=1')
          PY
          python /tmp/fix.py
      - name: Validate corrected bank and production rendering
        env:
          FUNNY_CLIP_DRY_RUN: '1'
        run: |
          python scripts/funny_clip_spotify.py
          python - <<'PY'
          import json
          from pathlib import Path
          import scripts.funny_clip_spotify as sp

          bank=json.loads(Path('data/funny_clip_posts_all_episodes.json').read_text(encoding='utf-8'))
          bad_terms=[
            '鴨川ホルモン','大棟','方針縁起','先頭って応答','ピンさん','藤いかぜ','そんな狂気',
            '切り散らかすときに',' 楊 ','三つ玉絵','余物併食い','足立さん','大間知らないと思うけど',
            '土三日時計','湿菌','三角部','ボルペン','ブラックウィード','X面ゼロ','武之内豊か',
            'イボンヌ','ハルマン','常に常','現場式','おはまり','完成も上がったところで','真珠もの'
          ]
          blob=json.dumps(bank,ensure_ascii=False)
          stale=[x for x in bad_terms if x in blob]
          if stale: raise RuntimeError(f'stale transcript errors remain: {stale}')
          for item in sp.base.load_bank():
              root=sp.base.render_root(item)
              reply=sp.render_reply(item)
              if len(root)>280: raise RuntimeError(f'over 280: {item["id"]}')
              if '「「' in root or '」」' in root: raise RuntimeError(f'nested quotes remain: {item["id"]}')
              if '/search/' in reply: raise RuntimeError(f'Spotify search fallback: {item["id"]}')
          print('[OK] corrected funny clip bank renders cleanly')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/funny_clip_posts_all_episodes.json scripts/funny_clip_buffer.py
          git diff --cached --quiet && exit 0
          git commit -m 'Correct funny clip transcript errors'
          git push origin HEAD:fix/funny-clip-transcript-cleanup
