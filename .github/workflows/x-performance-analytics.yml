name: X Performance Analytics

on:
  schedule:
    # 毎日 22:45 JST (= 13:45 UTC)。Bufferのメトリクスは最大約24h遅延する。
    - cron: '45 13 * * *'
  workflow_dispatch:

concurrency:
  group: x-performance-analytics
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Collect Buffer X metrics
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.x_metrics_report

      - name: Select winner candidates
        run: python -m scripts.winner_candidates

      - name: Save analytics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analytics/x_metrics_history.json analytics/X_PERFORMANCE.md data/winner_candidates.json
          if git diff --cached --quiet; then
            echo "No analytics change"
            exit 0
          fi
          git commit -m "update X performance analytics [skip ci]"
          git pull --rebase
          git push
