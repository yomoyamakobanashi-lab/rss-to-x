name: Discussion Posts via Buffer

on:
  schedule:
    # 火曜 09:10 JST（= 00:10 UTC）
    - cron: '10 0 * * 2'
    # 木曜 10:10 JST（= 01:10 UTC）
    - cron: '10 1 * * 4'
  workflow_dispatch:

concurrency:
  group: discussion-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post discussion through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.discussion_buffer

      - name: Save discussion rotation state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add state_discussion.json
          git commit -m "rotate discussion post [skip ci]" || exit 0
          git push
