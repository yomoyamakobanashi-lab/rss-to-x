name: Funny Clip Quality Audit

# Canonical funny-clip QA gate: run on the QA branch and on main after merge.
on:
  push:
    branches:
      - main
      - fix/funny-clip-quality-qa
    paths:
      - 'data/funny_clip_*.json'
      - 'data/spotify_episodes.json'
      - 'data/spotify_episode_overrides.json'
      - 'scripts/funny_clip_*.py'
      - '.github/workflows/funny_clip_quality_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependency
        run: python -m pip install requests
      - name: Production funny clip dry run
        env:
          FUNNY_CLIP_DRY_RUN: '1'
        run: python -m scripts.funny_clip_spotify
      - name: Audit stored episode links
        run: python scripts/funny_clip_quality_audit.py
      - name: Snapshot LISTEN transcripts for QA
        run: python scripts/funny_clip_transcript_snapshot.py
      - name: Build full QA packet
        run: python -m scripts.funny_clip_full_qa_packet
      - name: Build human QA packet
        run: python scripts/funny_clip_human_qa_packet.py
      - name: Build legacy human QA packet
        run: python scripts/funny_clip_legacy_qa_packet.py
      - name: Probe raw LISTEN transcript storage
        run: python scripts/funny_clip_raw_probe.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-quality-report
          path: funny_clip_quality_report.json
          if-no-files-found: error
      - name: Upload transcript snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-transcript-snapshot
          path: funny_clip_transcript_snapshot.json
          if-no-files-found: error
      - name: Upload full QA packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-full-qa-packet
          path: funny_clip_full_qa_packet.json
          if-no-files-found: error
      - name: Upload human QA packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-human-qa-packet
          path: funny_clip_human_qa_packet.json
          if-no-files-found: error
      - name: Upload legacy human QA packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-legacy-qa-packet
          path: funny_clip_legacy_qa_packet.json
          if-no-files-found: error
      - name: Upload raw probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funny-clip-raw-probe
          path: funny_clip_raw_probe.json
          if-no-files-found: error
