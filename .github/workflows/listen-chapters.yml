name: Generate Spotify chapters from LISTEN

on:
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 JST daily
  push:
    paths:
      - 'scripts/listen_to_spotify_chapters.py'
      - '.github/workflows/listen-chapters.yml'

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install parser dependency
        run: pip install beautifulsoup4

      - name: Generate Spotify-ready chapters
        run: python scripts/listen_to_spotify_chapters.py

      - name: Show generated chapters
        run: cat data/generated_chapters/latest.txt

      - name: Detect new or changed chapter output
        id: changes
        shell: bash
        run: |
          STATUS=$(git status --porcelain -- data/generated_chapters)
          if [ -z "$STATUS" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No chapter changes.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'New or changed LISTEN chapter output found:'
            echo "$STATUS"
          fi

      - name: Create Spotify paste Issue
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE=$(jq -r '.title' data/generated_chapters/latest.json)
          LISTEN_URL=$(jq -r '.listen_episode_url' data/generated_chapters/latest.json)
          EPISODE_ID=${LISTEN_URL##*/}
          MARKER="listen-chapter:${EPISODE_ID}"
          ISSUE_TITLE="Spotifyチャプター貼り付け: ${TITLE}"

          EXISTING=$(gh issue list \
            --state all \
            --search "${MARKER} in:body" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already exists for ${LISTEN_URL}; skipping duplicate creation."
          else
            {
              echo '<!-- '"${MARKER}"' -->'
              echo 'LISTENでチャプター生成が確認されました。'
              echo
              echo '**Spotify for Creators の既存エピソード説明文は消さず、末尾に以下をそのまま追加してください。**'
              echo
              echo '```text'
              cat data/generated_chapters/latest.txt
              echo '```'
              echo
              echo "LISTEN: ${LISTEN_URL}"
              echo
              echo '貼り付けが終わったら、このIssueをCloseすれば完了です。'
            } > /tmp/spotify-chapters-issue.md

            gh issue create \
              --title "$ISSUE_TITLE" \
              --body-file /tmp/spotify-chapters-issue.md
          fi

      - name: Commit changed chapter output
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/generated_chapters/latest.txt data/generated_chapters/latest.json
          git commit -m 'Update LISTEN-derived Spotify chapters'
          git push
