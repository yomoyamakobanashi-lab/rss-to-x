name: Social Pack Dry Run

on:
  push:
    branches: [social-pack-v1]
    paths:
      - '.social-pack-test-trigger'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile new modules
        run: |
          python -m py_compile \
            scripts/social_pack_buffer.py \
            scripts/winner_candidates.py \
            scripts/x_metrics_report_v2.py \
            scripts/audiogram_prepare.py \
            scripts/audiogram_post.py
      - name: Validate empty social pack queue is a safe no-op
        run: python -m scripts.social_pack_buffer
      - name: Validate winner candidate generator
        run: python -m scripts.winner_candidates
      - name: Validate dynamic classifier
        run: |
          python - <<'PY'
          from scripts import x_metrics_report_v2 as v2
          assert v2.classify_post('コアラのマーチの絵柄を確認しながら食べたい。運転中にやったら事故る。映画の話から、なぜかそこまで行きました。') == 'audiogram'
          assert v2.classify_post('🎧 新着エピソード公開\n\nテスト') == 'new_podcast'
          print('[OK] dynamic classifier')
          PY
