name: Random Episode via Buffer

on:
  schedule:
    # 金曜 20:00 JST（= 11:00 UTC）
    # リンク告知は週1に抑え、火・木朝はリンクなし論点投稿に譲る。
    - cron: '0 11 * * 5'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post random episode through Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m scripts.random_episode_buffer
