name: Post Note via Buffer

on:
  schedule:
    # 毎時43分にRSSを確認。最新記事が未告知かつ公開48時間以内の時だけBufferへ送る。
    - cron: '43 * * * *'
  workflow_dispatch:

concurrency:
  group: note-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Sanity check Buffer secret
        run: |
          test -n "${{ secrets.BUFFER_API_KEY }}" || (echo "BUFFER_API_KEY is empty" && exit 1)

      - name: Run note poster
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          NOTE_MIN_AGE_MINUTES: '15'
          NOTE_MAX_CONTENT_AGE_HOURS: '48'
        run: python note_poster_buffer.py

      - name: Save note state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add state_note.json
          git commit -m "update note state [skip ci]" || exit 0
          git push
