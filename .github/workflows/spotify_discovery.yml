name: Temporary Spotify Episode Discovery

on:
  push:
    branches:
      - feat/funny-quotes-hooks-all-spotify
    paths:
      - .github/workflows/spotify_discovery.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Fetch all Spotify podcast episodes
        run: |
          cat > scrape_spotify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const showUrl = 'https://open.spotify.com/show/4o8l9DJWMuwUht2pvkEytS';
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({ viewport: { width: 1440, height: 1200 } });
          const page = await context.newPage();
          let episodeRequest = null;
          const episodeResponses = [];

          page.on('request', async request => {
            const postData = request.postData();
            if (!postData || !request.url().includes('api-partner.spotify.com/pathfinder/v2/query')) return;
            try {
              const body = JSON.parse(postData);
              if (body.operationName === 'queryPodcastEpisodes' && body.variables?.uri === 'spotify:show:4o8l9DJWMuwUht2pvkEytS') {
                const headers = await request.allHeaders();
                episodeRequest = { url: request.url(), body, headers };
              }
            } catch {}
          });
          page.on('response', async response => {
            if (!response.url().includes('api-partner.spotify.com/pathfinder/v2/query')) return;
            try {
              const req = response.request();
              const postData = req.postData();
              if (!postData) return;
              const body = JSON.parse(postData);
              if (body.operationName !== 'queryPodcastEpisodes') return;
              episodeResponses.push(await response.json());
            } catch {}
          });

          await page.goto(showUrl, { waitUntil:'domcontentloaded', timeout:90000 });
          await page.waitForTimeout(10000);
          if (!episodeRequest || !episodeResponses.length) throw new Error('Could not capture Spotify queryPodcastEpisodes request');

          const first = episodeResponses[0];
          const episodePage = first?.data?.podcastUnionV2?.episodesV2;
          const total = episodePage?.totalCount || 0;
          const limit = episodeRequest.body.variables.limit || 50;
          const pages = [first];

          const safeHeaders = {...episodeRequest.headers};
          for (const key of Object.keys(safeHeaders)) {
            if (['content-length','host','connection','accept-encoding'].includes(key.toLowerCase())) delete safeHeaders[key];
          }

          for (let offset = limit; offset < total; offset += limit) {
            const body = JSON.parse(JSON.stringify(episodeRequest.body));
            body.variables.offset = offset;
            const resp = await context.request.post(episodeRequest.url, {
              headers: safeHeaders,
              data: body,
              timeout: 60000,
            });
            if (!resp.ok()) throw new Error(`Spotify page offset ${offset} failed: ${resp.status()} ${await resp.text()}`);
            const json = await resp.json();
            pages.push(json);
          }

          const episodes = [];
          for (const response of pages) {
            for (const item of response?.data?.podcastUnionV2?.episodesV2?.items || []) {
              const entity = item?.entity || {};
              const data = entity?.data || {};
              const uri = entity?._uri || data?.uri || '';
              const idMatch = String(uri).match(/spotify:episode:([A-Za-z0-9]+)/);
              if (!idMatch) continue;
              episodes.push({
                id: idMatch[1],
                spotifyUrl: `https://open.spotify.com/episode/${idMatch[1]}`,
                title: data?.name || null,
                releaseDate: data?.releaseDate?.isoString || data?.releaseDateTime?.isoString || null,
                typename: data?.__typename || null,
              });
            }
          }

          fs.mkdirSync('spotify-discovery', {recursive:true});
          fs.writeFileSync('spotify-discovery/all_episodes.json', JSON.stringify(episodes, null, 2));
          fs.writeFileSync('spotify-discovery/summary.json', JSON.stringify({totalReported: total, fetched: episodes.length, pages: pages.length}, null, 2));
          console.log(`Spotify episodes: reported=${total}, fetched=${episodes.length}, pages=${pages.length}`);
          await browser.close();
          EOF
          node scrape_spotify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotify-discovery
          path: spotify-discovery/
          retention-days: 1
