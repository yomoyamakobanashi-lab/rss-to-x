name: Temporary Spotify Episode Discovery

on:
  push:
    branches:
      - feat/funny-quotes-hooks-all-spotify
    paths:
      - .github/workflows/spotify_discovery.yml

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build fully linked Spotify episode index
        run: |
          cat > scrape_spotify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';

          const showUri = 'spotify:show:4o8l9DJWMuwUht2pvkEytS';
          const showUrl = 'https://open.spotify.com/show/4o8l9DJWMuwUht2pvkEytS';
          const normalize = value => String(value || '')
            .normalize('NFKC').toLowerCase()
            .replace(/[\uFFFC\s\u3000#『』「」〖〗【】()（）\[\]<>〈〉《》・,:：;；.!！?？…〜~—–―ー_\-"'“”‘’]/g, '');

          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext({ viewport: { width: 1440, height: 1200 } });
          const page = await context.newPage();
          let episodeRequest = null;
          const episodeResponses = [];
          page.on('request', async request => {
            const postData = request.postData();
            if (!postData || !request.url().includes('api-partner.spotify.com/pathfinder/v2/query')) return;
            try {
              const body = JSON.parse(postData);
              if (body.operationName === 'queryPodcastEpisodes' && body.variables?.uri === showUri) {
                episodeRequest = { url: request.url(), body, headers: await request.allHeaders() };
              }
            } catch {}
          });
          page.on('response', async response => {
            if (!response.url().includes('api-partner.spotify.com/pathfinder/v2/query')) return;
            try {
              const postData = response.request().postData();
              if (!postData) return;
              const body = JSON.parse(postData);
              if (body.operationName === 'queryPodcastEpisodes') episodeResponses.push(await response.json());
            } catch {}
          });

          await page.goto(showUrl, { waitUntil:'domcontentloaded', timeout:90000 });
          await page.waitForTimeout(10000);
          if (!episodeRequest || !episodeResponses.length) throw new Error('Could not capture Spotify episode request');
          const first = episodeResponses[0];
          const total = first?.data?.podcastUnionV2?.episodesV2?.totalCount || 0;
          const limit = episodeRequest.body.variables.limit || 50;
          const pages = [first];
          const headers = {...episodeRequest.headers};
          for (const key of Object.keys(headers)) {
            if (key.startsWith(':') || ['content-length','host','connection','accept-encoding'].includes(key.toLowerCase())) delete headers[key];
          }
          for (let offset = limit; offset < total; offset += limit) {
            const body = JSON.parse(JSON.stringify(episodeRequest.body));
            body.variables.offset = offset;
            const resp = await context.request.post(episodeRequest.url, {headers, data:body, timeout:60000});
            if (!resp.ok()) throw new Error(`Spotify offset ${offset} failed: ${resp.status()}`);
            pages.push(await resp.json());
          }

          const episodes = [];
          for (const response of pages) {
            for (const item of response?.data?.podcastUnionV2?.episodesV2?.items || []) {
              const entity = item?.entity || {};
              const data = entity?.data || {};
              const uri = entity?._uri || data?.uri || '';
              const m = String(uri).match(/spotify:episode:([A-Za-z0-9]+)/);
              if (!m || !data?.name) continue;
              episodes.push({
                id:m[1],
                spotifyUrl:`https://open.spotify.com/episode/${m[1]}`,
                title:data.name,
                normalized:normalize(data.name),
                releaseDate:data?.releaseDate?.isoString || data?.releaseDateTime?.isoString || null,
              });
            }
          }

          const index = JSON.parse(fs.readFileSync('data/spotify_episodes.json', 'utf8'));
          const unresolved = [];
          let linked = 0;
          for (const row of index) {
            const wanted = normalize(row.title || row.normalizedTitle);
            let candidates = episodes.filter(ep => ep.normalized === wanted);
            let method = 'title-exact';
            if (!candidates.length) {
              candidates = episodes.filter(ep => ep.normalized.includes(wanted) || wanted.includes(ep.normalized));
              method = 'title-contains';
            }
            if (candidates.length !== 1 && row.pubDate) {
              const t = new Date(row.pubDate).getTime();
              const byTime = episodes.filter(ep => ep.releaseDate && Math.abs(new Date(ep.releaseDate).getTime() - t) <= 120000);
              if (byTime.length === 1) {
                candidates = byTime;
                method = 'release-time';
              }
            }
            if (candidates.length === 1) {
              row.spotifyUrl = candidates[0].spotifyUrl;
              linked += 1;
            } else {
              unresolved.push({index:row.index,title:row.title,pubDate:row.pubDate,method,candidateCount:candidates.length,candidates:candidates.map(x=>({title:x.title,url:x.spotifyUrl,releaseDate:x.releaseDate}))});
            }
          }

          fs.mkdirSync('spotify-discovery', {recursive:true});
          fs.writeFileSync('spotify-discovery/spotify_episodes_enriched.json', JSON.stringify(index, null, 2) + '\n');
          fs.writeFileSync('spotify-discovery/unresolved_index.json', JSON.stringify(unresolved, null, 2));
          fs.writeFileSync('spotify-discovery/summary.json', JSON.stringify({spotifyReported:total, spotifyTitled:episodes.length, indexCount:index.length, linked, unresolved:unresolved.length}, null, 2));
          console.log(`index=${index.length}; linked=${linked}; unresolved=${unresolved.length}`);
          await browser.close();
          EOF
          node scrape_spotify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotify-discovery
          path: spotify-discovery/
          retention-days: 1
