# temporary merge-gate validation; removed before merge
name: Temporary Funny + Spotify Validation

on:
  push:
    branches:
      - feat/funny-quotes-hooks-all-spotify
    paths:
      - .github/workflows/spotify_discovery.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Validate full funny bank with exact Spotify links
        env:
          FUNNY_CLIP_DRY_RUN: '1'
        run: python scripts/funny_clip_spotify.py
      - name: Validate coverage and quote boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts import funny_clip_buffer as base
          from scripts import funny_clip_spotify as spotify

          root = Path('.')
          banks = []
          for name in [
              'funny_clip_posts.json',
              'funny_clip_posts_archive.json',
              'funny_clip_posts_archive_2.json',
              'funny_clip_posts_archive_3.json',
          ]:
              banks.extend(json.loads((root / 'data' / name).read_text(encoding='utf-8')))

          sources = {item['source'] for item in banks}
          overrides = json.loads((root / 'data' / 'spotify_episode_overrides.json').read_text(encoding='utf-8'))
          assert sources <= set(overrides), f'missing source mappings: {sorted(sources - set(overrides))}'
          assert all(str(overrides[s]).startswith('https://open.spotify.com/episode/') for s in sources)

          index = json.loads((root / 'data' / 'spotify_episodes.json').read_text(encoding='utf-8'))
          assert len(index) == 127, len(index)
          assert all(str(row.get('spotifyUrl') or '').startswith('https://open.spotify.com/episode/') for row in index)

          koala = next(item for item in banks if item['id'] == 'popcorn-koala')
          rendered = base.render_root(koala)
          expected = '「でも運転中にそれをやると危ない。事故ったら警察も半笑いになるのでは」——という、映画と一切関係ない心配までしています'
          assert expected in rendered, rendered
          assert '心配までしています」' not in rendered, rendered

          for item in banks:
              root_post = base.render_root(item)
              reply = spotify.render_reply(item)
              assert len(root_post) <= 280, (item['id'], len(root_post))
              assert '/search/' not in reply, (item['id'], reply)
              assert 'open.spotify.com/episode/' in reply, (item['id'], reply)

          hooks = json.loads((root / 'data' / 'funny_hook_variants.json').read_text(encoding='utf-8'))
          assert len(hooks) >= 100, len(hooks)
          print(f'OK: clips={len(banks)} unique_sources={len(sources)} spotify_index={len(index)} hooks={len(hooks)}')
          print('KOALA SAMPLE:')
          print(rendered)
          print('REPLY SAMPLE:')
          print(spotify.render_reply(koala))
          PY
