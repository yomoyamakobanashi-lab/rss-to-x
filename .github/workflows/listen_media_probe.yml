name: Temporary LISTEN Media Probe

on:
  push:
    branches:
      - feat/funny-clip-every-episode
    paths:
      - .github/workflows/listen_media_probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Probe media URLs
        run: |
          cat > probe.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          const urls = [
            'https://listen.style/p/reelpal/lt7ujaek',
            'https://listen.style/p/reelpal/08x9zj0r',
            'https://listen.style/p/reelpal/gnrdz2nn',
            'https://listen.style/p/reelpal/mwnhzsa5'
          ];
          const browser = await chromium.launch({headless:true});
          const context = await browser.newContext();
          const out=[];
          for (const url of urls) {
            const page=await context.newPage();
            const media=[];
            page.on('response', async r=>{
              try {
                const h=await r.allHeaders();
                const ct=(h['content-type']||'').toLowerCase();
                if (ct.startsWith('audio/') || /\.(mp3|m4a|aac|wav)(\?|$)/i.test(r.url())) media.push({url:r.url(),contentType:ct,status:r.status()});
              } catch {}
            });
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(2500);
            const dom=await page.locator('audio,source').evaluateAll(ns=>ns.map(n=>({tag:n.tagName,src:n.src||n.getAttribute('src'),type:n.getAttribute('type')}))).catch(()=>[]);
            const perf=await page.evaluate(()=>performance.getEntriesByType('resource').map(x=>x.name).filter(x=>/\.(mp3|m4a|aac|wav)(\?|$)|audio|podcast/i.test(x)));
            out.push({page:url,dom,media:[...new Map(media.map(x=>[x.url,x])).values()],perf});
            await page.close();
          }
          fs.mkdirSync('media-probe',{recursive:true});
          fs.writeFileSync('media-probe/media.json',JSON.stringify(out,null,2));
          await browser.close();
          EOF
          node probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: listen-media-probe
          path: media-probe/
          retention-days: 1
