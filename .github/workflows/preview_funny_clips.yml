name: Temporary Preview Every Episode Funny Clip

on:
  push:
    branches:
      - feat/funny-clip-every-episode
    paths:
      - .github/workflows/preview_funny_clips.yml

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install preview dependency
        run: python -m pip install requests
      - name: Render one representative post per Spotify episode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import scripts.funny_clip_spotify as sp

          bank = sp.base.load_bank()
          episodes = json.loads(Path('data/spotify_episodes.json').read_text(encoding='utf-8'))
          by_url = {}
          for item in bank:
              url = sp._exact_spotify_url(item)
              if url and url not in by_url:
                  by_url[url] = item

          lines=[]
          missing=[]
          for ep in episodes:
              url=str(ep.get('spotifyUrl') or '').strip()
              item=by_url.get(url)
              if not item:
                  missing.append((ep.get('index'), ep.get('title'), url))
                  continue
              lines.append(f"===== EP {ep['index']:03d} | {ep['title']} =====")
              lines.append(sp.base.render_root(item))
              lines.append('--- reply ---')
              lines.append(sp.render_reply(item))
              lines.append('')
          if missing:
              raise RuntimeError(f"missing representatives: {missing}")
          if len(lines) < 127*5:
              raise RuntimeError('preview unexpectedly short')
          Path('preview.txt').write_text('\n'.join(lines), encoding='utf-8')
          print(f'[OK] rendered representatives={len(episodes)}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: every-episode-funny-preview
          path: preview.txt
          retention-days: 1
