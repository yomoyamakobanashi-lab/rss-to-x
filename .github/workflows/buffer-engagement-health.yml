name: Buffer engagement health\n# Publishing health and engagement-capability probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/buffer-engagement-health.yml'
      - 'scripts/buffer_engagement_health.py'
      - 'buffer_client.py'
  schedule:
    - cron: '17 0,12 * * *'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Diagnose Buffer and X engagement capability
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python scripts/buffer_engagement_health.py
      - name: Persist sanitized diagnostic
        if: always()
        run: |
          if [ -f diagnostics/buffer_engagement_health.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add diagnostics/buffer_engagement_health.json
            git diff --cached --quiet || git commit -m "chore: update Buffer engagement health [skip ci]"
            git push
          fi
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffer-engagement-health
          path: diagnostics/buffer_engagement_health.json
          if-no-files-found: warn
          retention-days: 14
